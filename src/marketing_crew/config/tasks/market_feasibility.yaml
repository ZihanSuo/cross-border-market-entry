name: market_feasibility_task
agent: market_researcher_feasibility
description: |
  以下是用户提供的项目信息与原始材料。本步骤输出**决策备忘录式可行性研究**。
  不要展开开拓路径与执行方案。

  {brief}

  ## 第 0 步（写任何内容之前必须先做）：确定目标市场与品类

  从上面简报读出 `market_scope`（目标市场）与 `product_description`（品类），在报告开头写一行：
  「本报告目标市场：<brief 的 market_scope>；品类：<从 brief 读出的品类>」。

  **下文所有规则里的「目标市场」都指你在这一步读出来的那个市场，「本品类」指 brief 里的实际品类。
  规则中出现的具体例子（英国 REACH、草本护肤、Weleda 等）只是举例说明规则的形态，
  不是要你套用到当前案例上**——历史版本在这里出过严重错误：模板里写死了「英国」，
  做泰国案例时输出了「泰国品牌的英国市场份额」这种自相矛盾的内容。
  全文任何位置都不得出现与 brief 的 market_scope 不一致的国家名。

  ## 硬规则（A1 / B2 / B3 / B4 / C）

  ### 空话禁令（A1）
  1. **禁止**把「找法务咨询 / 任命本地责任人或代理 / 完成化学品与成分注册 / 做合规」写成核心洞察、
     Top 风险主因、或 90 天验证的唯一内容——这些是**所有**进入该市场的同品类品牌都要做的行业标配
     （在英国表现为 Responsible Person + UK REACH，在泰国表现为 Thai FDA 通知备案 + 本地代理，
     形式不同但性质一样，都是标配而非品牌特有发现）。
  2. 行业标配可放在「附录：通用合规 checklist」，且明确标注「非本品牌特有发现」。
  3. 90 天动作必须是**可验证的市场/品牌假设**（例：同品类价格带比对、目标零售是否在售同类产品、
     公开舆情检索结果），禁止「咨询律师后决定」这类空步骤。

  ### 门槛语义（B3）
  4. 门槛表状态只能用：
     - **规则已核实**：公开法规/指南存在且已读（附 URL）——不等于品牌已完成
     - **品牌侧未完成/未知**：本品牌是否已满足尚不知
     - **待验证（市场假设）**：需要证据才能判断的市场/消费者命题
     - **红线**：有证据表明当前不可克服的障碍（须有 URL 或用户资料）
  5. **禁止**对「须任命 RP」标成「已确认（品牌已就绪）」；只能标「规则已核实」。

  ### 决策逻辑（B2 / B4）
  6. **不得**仅因「存在通用合规步骤」给出「暂不建议进入」。合规是成本/工期，不是自动否决。
  7. 「暂不建议 / 暂缓」必须基于**品牌特有或证据化**理由，例如：
     价格带无法对标、公开证据显示渠道关闭、红线级合规冲突、或关键市场假设验证失败。
     若仅是「还需完成标配合规 + 证据不足」，结论应为 **「可继续准备，先验证假设；暂缓铺货」**，
     而不是「暂不建议进入」。
  8. 评分表权重必须合计 **1.0**（建议：需求匹配 0.25、合规可完成性 0.15、渠道可达 0.20、
     竞争强度 0.20、品牌资产匹配 0.20）。展示计算公式：Σ(权重×得分)。

  8.5. **【打分锚点，必须逐条对照，不得凭感觉给分】**

     历史问题：同一个理由「竞争激烈」，在不同版本里被打过 2 分、3 分、4 分——
     因为规则只说「给 1–5 分」，从没定义 5 分和 1 分各是什么。结果这张表在
     11 个归档版本里**从未影响过最终结论**（每一版都是「建议进入」），
     等于装饰品。下面给出可判定的锚点，**每一行都必须写明你依据哪一条锚点给的分**。

     | 维度 | 5 分 | 3 分 | 1 分 |
     |------|------|------|------|
     | 需求匹配 | 目标市场已有**同细分品类**产品在售且有增长证据（附 URL） | 品类大盘可见但本细分证据不足 | 有证据显示该细分需求萎缩或不存在 |
     | 合规可完成性 | 制度清晰、步骤明确、无本地实体强制要求 | 制度清晰但需本地责任人/代理等额外主体 | 存在红线级障碍（成分被禁、品类不准入等，须有 URL） |
     | 渠道可达 | 已查到目标市场**具体零售在售页**（本品牌或高度同类品牌） | 只查到平台存在、未见同类品牌在售证据 | 有证据显示目标渠道对该类品牌关闭 |
     | 竞争强度 | 目标价位带**≤1 家**竞品，且非头部品牌占据 | 有竞争但存在可切入细分 | 头部占据主要价位带且价格带全覆盖，无明显空隙 |
     | 品牌资产匹配 | brief 中有**≥3 条**可迁移到目标市场的具体资产（渠道背书/科研/团队/供应链） | 有 1–2 条，或资产与目标市场关联需再论证 | 无可迁移资产，或核心叙事在目标市场存在已证实的冲突 |

     2 分与 4 分用于介于相邻锚点之间的情况，同样要说明理由。

  8.6. **【总分必须影响结论，否则这张表没有意义】**
     - 加权总分 **≥ 3.5** → 可以写「建议进入（可开始准备）」
     - 加权总分 **2.5 ～ 3.5** → 结论只能是「**先验证假设、暂缓铺货**」，
       并在「90 天验证动作」里明确写出：验证哪几个维度、达到什么标准才能升级为「建议进入」
     - 加权总分 **< 2.5** → 结论必须是「暂不建议进入」，并写明是哪一两个维度拉低的
     - **禁止**出现「总分 2.8 但结论写建议进入」这类分数与结论不一致的情况；
       如果你认为总分不该决定结论，那说明打分打错了，回去重打，而不是无视总分

  9. 依据为「待验证」的维度：得分只能给 **3（中性）** 或标注「证据不足、不纳入加权」；
     **禁止**在无证据时打 1–2 分并当作「信任度低」事实。
     注意这条与 8.5 不冲突：锚点是**有证据时**怎么给分，本条是**无证据时**怎么给分。
  10. 「品牌信任缺口」若用户章为证据不足：该行写「证据不足，中性 3 或不纳入」，
      禁止写「中国品牌信任度低」。

  ### 证据与 brief（C）
  11. 数字规则与证据分级见 knowledge `source_rules`（高置信度仅 A 级）。
  12. 付费摘要页/营销博客最多「中」，并注明局限。
  13. 必须引用 brief ≥3 条品牌事实；并尽量覆盖：既有渠道（如 JOYCE）、产品/成分、
      创始人资产、包装或实验室主张、价格带立场中的多项（有则引用）。
  14. 用户洞察无 URL → 整段「证据不足」，禁止推测偏好。

  ### 品类 / 文化接受度（要深度，但不锁检索剧本）
  15. **必须用搜索做公开桌面研究**；查什么词、先查零售还是媒体——你自己定，按 brief 的品类与卖点发挥。
  15.5. **先搜索再下品类结论（硬门槛，query 自定）**：写出「已有市场空间 / 多款在售 /
     可见度高」之前，必须已调用搜索工具；禁止 0 次搜索就下乐观结论。
     禁止仅用电商平台首页 URL 支撑「多款在售」。
  16. **深度的定义（结果标准，不是步骤清单）**：所谓「有市场空间 / 有接受线索」，必须落到
     **可核对的本地观察**（例如：某零售站的真实商品页或品牌店、当地媒体的具体报道、可打开帖文）。
     只写「电商上已有上市」却给不出真链接 = 不合格。宁可写「证据不足」。
  17. **禁止伪造证据外壳**：不许编造商品 URL、数字 ID、「具体链接待定/链接待确认」、假想域名。
     搜不到就写「证据不足」或「未找到一手公开讨论」。
  18. **鼓励你自由探索的方向**（任选组合，不必全做）：同风格/同品类本地在售、本地标杆品牌、
     当地语言媒体、可核实社媒/论坛；问卷/焦点小组/无来源「X% 喜欢」禁止写成已完成。
  19. **分层**：(a) 品类接受度；(b) 对「中国」国家层面态度；(c) 对「中国品牌」产品层面态度。
     三层分开；任一层无 URL →「证据不足」；禁止写成已证实偏见。
  20. 90 天动作优先补桌面缺口；问卷仅作人工后续，不得当本报告唯一验证手段。

  ### 章节一致性（D，新增——防止「证据不足」被后文悄悄升级成结论）
  22. **凡本文任一处（品类/文化接受度、用户与信任等）已标「证据不足」的命题，全文其余章节
     （尤其是「建议（一页纸）」的关键不确定项、最大风险 Top 3、机会与风险）再次提到同一命题时，
     必须原样保留「证据不足」这个状态，不得改写成已证实的风险或结论**（例：品类接受度章节写了
     「中国品牌信任度证据不足」，风险 Top 3 就不能写「目标市场消费者对中国品牌存在潜在偏见」这种
     听起来已经证实的表述——即使意思相近，语气不能从「不确定」滑到「已确认」）。
  23. 写完整份报告后自查一遍：把「建议（一页纸）」里的每条不确定项/风险，对照它们在正文对应章节
     的原始证据状态，状态不一致就改回正文的原始状态。

  ### 其它
  24. 禁止绝对化词；禁止写开拓路径执行细节。
  25. 市场研究机构（Statista / Mintel / Euromonitor / Grand View 等）的**首页**不得当市场规模证据；
     无具体报告页 URL 则删除该数字。
  26. **禁止使用 `TBD`、`待更新`、`待补充`、`链接待确认`、假商品路径等占位符代替证据或 URL**：
     没有证据就写「证据不足」。把空白伪装成待办或伪装成已检索，比诚实写不足更糟。
  27. **门槛清单的「依据」列必须是可核查的东西**：要么是具体法规/官方页面 URL，要么写明「证据不足」。
     标「规则已核实」的行必须有 URL；「含义」列写清对本品牌的具体影响，不要只写「必须满足」。

  ## 分析框架

  ### 1. 品牌—市场匹配（必须，用 brief）
  ### 2. 品类/文化接受度桌面研究（必须；有搜索结果再下结论）
  ### 3. 市场吸引力证据（A/B/C 级标注）
  ### 4. 用户与信任（无证据则停；与第 2 节区分：第 2 节是品类，本节是品牌信任）
  ### 5. 门槛清单（区分规则已核实 vs 品牌侧未知 vs 市场假设）
  ### 6. 竞争 L1 + 深拆名单
  ### 7. 加权评分（权重和=1.0）

  ## 检查清单
  - 建议页没有「去问法务」当主结论
  - 未把通用合规当否决理由
  - 「文化接受度」有真链接观察或明确「证据不足」；全文无假 URL /「链接待定」
  - 权重和为 1.0；待验证维度未乱扣分
  - ≥3 条 brief 事实；无证据不写「中国品牌偏见」定论
  - 对「中国」态度与对「中国品牌」态度分开写，没有互相替代
  - 逐条核对「建议（一页纸）」里的不确定项/风险 Top 3，跟正文对应章节的证据状态一致
    （正文写「证据不足」，「建议」页就不能把同一命题写成已证实结论）
  - 全文没有出现与 brief 的 market_scope 不一致的国家名
  - 全文没有任何 TBD / 待更新 / 待补充；该写「证据不足」的地方写了「证据不足」
  - 门槛清单每行的「依据」列有 URL 或明确写了「证据不足」；标「规则已核实」的行必须有 URL
expected_output: |
  一份决策备忘录式可行性文件，必须按下列结构。
  **模板里的「目标市场」「本品类」字样，输出时替换成 brief 里的实际市场与品类名称。**

  开头一行：本报告目标市场：<brief 的 market_scope>；品类：<brief 的品类>

  ## 建议（一页纸）
  - 结论：建议进入（可开始准备） / 先验证假设、暂缓铺货 / 暂不建议（须写品牌特有否决理由）
    **必须与可行性评分表的总分一致**（规则 8.6：≥3.5 / 2.5–3.5 / <2.5 三档）。
    在结论后用括号标出依据，例如：「先验证假设、暂缓铺货（加权总分 3.15）」
  - 本品牌特有的关键不确定项（3～5 条；**不要**把本地责任人/备案等标配列在这里当「洞察」）
  - 最大风险 Top 3（须品牌相关或有证据；禁止「未合规会违法」这类空话）
  - 90 天验证动作（每条：验证什么假设 | 方法 | 通过标准；优先桌面研究；问卷仅作人工后续）

  ## 品牌—市场匹配（引用 brief）
  - ≥3 条「来自用户资料」+ 对目标市场的含义（尽量含渠道/成分或配方/团队/包装等不同类型）

  ## 品类与文化接受度（桌面研究）
  ### 本品类核心卖点在目标市场的可见度与接受线索
  - 用真实 URL 支撑的本地观察（条数不硬性规定；有几条算几条，假链一条都不要）
  - 小结：品类层面是「已有市场空间 / 证据不足 / 检索无果」三选一——选前两者必须有真链接
  ### 对「中国」整体的态度（国家层面，与品类分开）
  - 有 URL 的观察；否则仅写「证据不足」（禁止偏见定论）
  ### 对「中国品牌」具体的态度（品牌/产品层面，与上一节分开，不得互相代替）
  - 有 URL 的观察；否则仅写「证据不足」（禁止偏见定论）
  ### 对本品牌的含义
  - 哪些接受度已由桌面研究支撑；哪些仍需人工调研
  - 若品类/国家/品牌三层里任一层是「证据不足」，本节以及后文「建议」页引用时必须保持「证据不足」，
    不得升级成已证实结论

  ## 进入门槛清单
  | 门槛 | 类型（行业标配/品牌特有） | 状态（规则已核实/品牌侧未完成或未知/待验证（市场假设）/红线） | 依据 | 含义 |
  |------|---------------------------|--------------------------------------------------|------|------|
  - 「依据」列必须是官方页面 URL 或明确的「证据不足」，**不得写 TBD**；标「规则已核实」的行必须有 URL
  - 「含义」列写清对本品牌的具体影响（时间成本/是否需本地实体/影响哪个环节），不要只写「必须满足」

  ## 附录：通用合规 checklist（非研究发现）
  - 简要列出目标市场的标配步骤（本地责任人或代理、备案/通知、标签与宣称等）+ URL；
    明确「所有进入者都要做」——具体制度名称按目标市场实际情况写，不要套用其它国家的名称

  ## 证据摘要
  ### 市场与趋势（结论 | 维度 | URL | 证据级别A/B/C | 置信度）
  ### 用户与信任（无 URL 则仅「证据不足」）
  ### 竞争格局速写（L1）+ 建议竞品深拆名单
  - 以上三节的 URL 列：有链接就写链接，没有就写「证据不足」，**禁止写 TBD**

  ## 可行性评分表
  **「对照哪条锚点」这一列是必填的**——写清你依据规则 8.5 表格里的哪一条给的分
  （例如「竞争强度=3：有竞争但 £30-50 存在可切入细分」）。只写分数不写锚点依据视为未完成。

  | 维度 | 权重(合计1.0) | 得分(1-5) | 对照哪条锚点 | 依据 | URL/用户资料/证据不足则中性 |
  |------|---------------|-----------|--------------|------|------------------------------|
  | 需求匹配 | 0.25 | | | | |
  | 合规可完成性 | 0.15 | | | | |
  | 渠道可达 | 0.20 | | | | |
  | 竞争强度 | 0.20 | | | | |
  | 品牌资产匹配 | 0.20 | | | | |
  - 计算：加权总分 = Σ(权重×得分)，写出算式与数字
  - **总分与结论的对应**（规则 8.6）：≥3.5 才可写「建议进入」；2.5–3.5 只能写
    「先验证假设、暂缓铺货」；<2.5 必须写「暂不建议进入」。
    这里要写一句：「总分 X.XX，对应结论 YYY，与本文开头『建议』一节一致」
  - 解读：合规维度反映「可完成性/复杂度」，**单独低分不足以**下「暂不建议进入」
  - 最后一列：有 URL 写 URL，来自 brief 写「用户资料」，没有则写「证据不足」，**禁止写 TBD**

  ## 机会与风险（机会须挂钩 brief；风险禁止空话合规套话）
  ## 建议进一步研究（仅证据缺口）

  ## 证据缺口清单（供下游补证，必须）
  列出 2～5 条仍为「证据不足 / 检索无果 / 待验证市场假设」的命题，供 `evidence_gap_fill_task` 二轮检索：
  | 缺口 ID | 命题 | 当前状态 | 建议检索关键词（给下游） |
  |---------|------|----------|--------------------------|
  - 不要把「任命 RP / 找法务」列进此表
  - 若某层（品类/国家态度/中国品牌）已有合格 URL，就不要再把它写成缺口

  ## 参考文献（标题 | URL | 年份 | 级别A/B/C）
output_file: outputs/market_feasibility.md
