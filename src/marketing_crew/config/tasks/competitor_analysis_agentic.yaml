name: competitor_analysis_agentic_task
agent: competitor_analyst_agentic
description: |
  ## 这个任务与 competitor_analysis_task 的区别

  那个任务给你一张表，你负责填格子。这个任务**放开「怎么查」，但不放开「交付什么」**。

  ### 第一次尝试失败的教训（必读，这段是为了防止你重蹈覆辙）

  这个任务的上一版把交付结构写成了「最低要求，不是上限，你可以自由增加」，
  结果模型把它读成了「随便写」，交出来的东西是：整份报告 **0 个 URL**、
  要求的 6 个章节**一个都没有**、竞品价格写成「Aesop £30-£50」这种没有来源的
  区间估计而不是具体 SKU 标价、差异化机会又写成了「利用东方草本的独特性、
  强调成分透明和可持续性」这句被明令禁止的空话。

  更糟的是它在结尾写：「相关网页的抓取和数据验证已成功完成」——
  但报告里一个链接都没有。**声称完成 ≠ 完成。**

  所以这一版把话说清楚：

  - **可以自主决定的只有三件事**：查几家竞品、每家查几个 SKU、深挖谁放弃谁
  - **其余一切都是硬性的**：下面 `expected_output` 里的每一节都必须有，
    缺任何一节 = 任务未完成
  - **不允许用"我已完成检索和验证"这类自我陈述代替证据**，
    只有写进报告的 URL 和核实记录才算数

  ## 你的目标

  回答：**目标品牌进入目标市场时最该关注的竞品是哪几家、为什么是这几家、
  以及竞争格局里存不存在一个它能占的位置。**

  用户简报：
  {brief}

  ## 第 0 步：确定目标市场与本地货币

  从简报的 `market_scope` 读出目标市场，报告开头第一行写：
  「本报告目标市场：<市场>；本地货币：<货币与符号>」。
  全文不得出现与之不一致的国家名。

  ## 完成条件（不满足就是没做完，必须继续工作）

  1. **报告中至少包含 6 个具体 URL**（不是域名首页，是具体页面）
  2. **至少 3 个商品页 URL 用 scrape_page 真的抓取过**
  3. **至少 3 家竞品**，每家至少 1 个带具体标价的可比 SKU
  4. 「差异化判断」一节至少 1 条**带具体数字**的可证伪判断

  达不到就回去继续查，不要提前交付。如果反复尝试后确实达不到某一条
  （例如目标市场本地站点普遍抓不到），**明确写出来是哪一条、试了什么、为什么失败**，
  这也是有价值的结论——但不能不写就当没这回事。

  ## ⚠️ 关于「核实」——这一版做了重要改动，请仔细读

  **上一版有一栏叫「核实状态」，让你自己填「已核实 / 核实失败」。这一栏已经删掉了。**

  删掉的原因是实测数据：上一次运行你写了 10 条「已用 scrape_page 核实，
  页面显示标价 £XX」，事后用工具调用日志逐条对质，**通过 0 条**：

  - 有 2 条声称核实的 URL，日志里**根本没有抓取记录**（其中一条你实际抓的是
    `aesop.co.uk/hand-and-body.html`，却在报告里写成了
    `aesop.co.uk/hand-and-body/hand-washes-and-balms/`——后者从没被访问过）
  - 有 4 条抓的是**品牌网站首页**（`weleda.co.uk/`、`paiskincare.com/` 等），
    首页上没有任何单品标价，不可能"显示标价 £9.50"
  - 有 1 条抓回来的是反爬拦截页，全文只有 106 个字符
    `"Just a moment... Enable JavaScript and cookies to continue"`，
    而你写的是"页面显示标价 £34.00"

  **问题不在于你没调用工具——日志显示你确实调了 6 次，全部成功返回。
  问题在于你把「调用过工具」当成了「完成了核实」，从不检查抓回来的内容里
  到底有没有那个价格。**

  所以现在：**核实的判定不再由你做，由代码在你交付之后自动完成**
  （对照工具调用日志，检查每个 URL 是否真被抓过、返回内容是否有效、
  声称的标价是否真的出现在页面内容里）。

  ### 你要做的改成这三件事

  1. **抓完之后，真的去看抓回来的内容里有没有那个价格**。
     没有就别写那个价格——去抓真正的单品页，或者写「未能取得标价」
  2. **报告里写的 URL，必须是你实际抓过的那一个**，不要写一个"看起来更像商品页"
     的链接。如果你抓的是分类页，就如实写分类页，并说明这不是单品页
  3. **在「抓取观察」栏如实记录你看到了什么**——这一栏问的是客观观察，
     不是让你给自己打分：
     - 抓到了什么类型的页面（单品页 / 分类页 / 首页 / 拦截页）
     - 返回内容里**有没有**出现你要找的价格（明确写"有"或"没有"）
     - 如果没有，你接下来做了什么（换 URL 重抓？还是放弃并标注证据不足？）

  **诚实写「抓到的是首页，内容里没有找到标价，因此该 SKU 标价未能核实」，
  比写「已核实」有价值得多，也不会被判为伪造。**

  ## 工具怎么用

  - **serper_search**：发现线索。搜品类关键词、搜竞品在哪些渠道有售、搜价格区间
  - **scrape_page**：**核实**。传入 URL 把页面抓下来看

  **凡是要写进报告的标价、SKU 名称、在售状态，都必须先用 scrape_page 抓过。**
  搜索结果的标题和摘要经常与页面实际内容对不上。

  历史教训（真实发生、跨三个版本没被发现）：某版报告写了一条 Aesop 商品页
  `.../uk/p/body/parley-seed-facial-hydrating-cream/`，路径段是 `/body/`（身体护理）
  但产品名是 Facial Cream（面部），且 `parley` 疑似是 `parsley` 的拼写错误。
  机械校验、QA 审校、人工三层都没能确认它真假，**因为验证它必须真的打开页面**。
  你现在有这个能力，这正是这个任务存在的意义。

  抓取失败也要如实记录（「该 URL 抓取失败：超时/404，标价未能核实」），
  不要假装核实过。

  ## 你可以自主决定的三件事（仅此三件）

  - **查几家竞品**：模板版固定 3-4 家。真实格局可能需要更多家才能看清价格带分布，
    也可能只有 2 家真正可比（那就补到 3 家并说明第 3 家的可比性有限）。
    最少 3 家，上不封顶，并在报告里说明为什么是这个数量
  - **每家查几个 SKU**：模板版每家 1 个——1 个孤立价格点谈不上价格带。
    需要几个由你判断
  - **深挖谁、放弃谁**：不是每家都值得同等篇幅。发现某家高度重叠就多花力气，
    发现某家不可比就说明理由后放弃

  ## 品类对齐（硬要求）

  代表 SKU 必须与目标品牌同品类且细分可比：面霜对面霜、精华对精华、散粉对散粉。
  拿沐浴露对比面部精华、拿防晒对比眼影盘都是无效对比。

  ## 硬规则（保证结论可核查，不可突破）

  1. **无 https 不写数字**：标价、市场份额、增长率都必须有可点击 URL；没有就写「证据不足」
  2. **禁止用免责词包装无来源数字**：「市场份额约 25%（证据不足）」违规——
     给了数字就必须有来源；「证据不足」只能用于**不含数字**的定性描述
  3. **禁止写价格区间代替具体标价**：「Aesop £30-£50」这种是无来源的区间估计，
     不是证据。必须是「某个具体 SKU + 具体标价 + 该 SKU 的商品页 URL」。
     多个 SKU 的价格分布应该由你查到的多个具体标价**自然形成**，而不是直接写个区间
  4. **商品页 URL 必须是目标市场本地站点的单品详情页**：不能是品牌首页、
     不能是分类/系列页（`/collections/`、`/all-brands/`）、不能是媒体文章或榜单页、
     不能是他国站点（`weleda.com` ≠ `weleda.co.uk`）、不能是跨境代购平台。
     拿不准标「商品页待确认」并说明原因
  5. **舆论/口碑必须是具体内容页**：品牌自己的社媒账号主页（`facebook.com/品牌名`）
     证明不了公众口碑，必须是具体帖子、评论串或第三方测评；找不到写「证据不足」
  6. **参考文献必须复用正文用过的最精确 URL**
  7. **禁止 TBD / 待更新 / 待补充**：没证据就写「证据不足」
  8. 无证据不得写「中国品牌不被信任」这类定论

  ## 「差异化判断」这一节是本任务成败的关键

  模板版每次都产出这样的内容，**上一版 agentic 也照抄了**：

  > 「强调东方草本叙事与现代科技结合，形成差异化」
  > 「进一步提高成分透明度以适应市场期望」

  **这类话换成任何一个同类品牌都成立，等于什么都没说。**不可证伪、不可执行。
  如果你写出的句子把品牌名换掉之后依然成立，那它就是废话，重写。

  合格的判断有三个特征——**有具体数字、指向具体缺口、标明依赖的未验证前提**。
  形式示范（只示范形式，别照抄内容）：

  > 「查到的 6 个可比 SKU 里，£30-50 这个价位只有 1 家（Pai 的 XX 面霜 £38，
  > 主打敏感肌），£60 以上有 3 家。若目标品牌定价 £45 并主打灵芝功效，
  > 可避开与 Aesop（£65）正面竞争，也不落入 Weleda（£12.95）的低价区间。
  > 前提：£30-50 确实存在需求——目前未查到该价位销量数据，属待验证假设。」

  查完发现**确实不存在**这样的缺口，就写「未发现明显价格带缺口」并说明理由——
  这比编一个漂亮但站不住的机会有价值得多。

  ## 交付前自查

  - 四条完成条件逐条对照，达不到的已明确写出原因
  - **报告里每个商品页 URL，都是我实际抓过的那一个**（不是另找的"更像商品页"的链接）
  - **每条标价，我都在抓回来的页面内容里真的看到了那个数字**；
    没看到的已如实写「未能取得标价」而不是「已核实」
  - 没有价格区间代替具体标价
  - 商品页 URL 都是本地站单品页，可疑的已标「待确认」
  - 没有无来源数字（包括加了「证据不足」的）
  - 差异化判断把品牌名换掉之后**不成立**（成立说明是废话，重写）
  - 说明了为什么选这几家、为什么是这个数量
  - 全文没有与 market_scope 不一致的国家名
  - **没有用「我已完成检索和验证」这类自我陈述代替实际证据**
expected_output: |
  一份竞品分析报告。**下面每一节都必须存在，缺任何一节视为任务未完成。**
  自由度在于每节写多少、查几家、深挖谁——不在于要不要写这一节。

  第一行：本报告目标市场：<market_scope>；本地货币：<货币>

  ## 研究过程说明
  - 实际怎么查的：搜了哪些关键词、抓取核实了哪些页面、中途调整过什么方向
  - 为什么选这几家竞品、为什么是这个数量（要说理由，不是只报数量）
  - 哪些线索查了但放弃了，原因是什么

  ## 竞品拆解（至少 3 家，上不封顶）
  每家必须包含以下全部字段：
  - 代表 SKU（具体产品名，不是品类名）
  - 本地货币标价（具体数字，**禁止写区间估计**；页面里没看到就写「未能取得标价」）
  - 商品页 URL（**必须是你实际抓过的那一个**）
  - **抓取观察**（客观记录你看到了什么，不是给自己打分）：
    页面类型（单品页/分类页/首页/拦截页）｜内容里有没有出现该标价（明确写"有"或"没有"）｜
    如果没有，你接下来做了什么
  - 定位与卖点
  - 目标市场渠道线索
  - 目标市场本地市场份额（有 URL 才写数字，否则「证据不足」）
  - 公开舆论/口碑线索（具体内容页，否则「证据不足」）
  - 与目标品牌的关系：重叠在哪、不可比在哪

  ## 价格带分布
  - 把查到的所有可比 SKU 按价位从低到高排开，标出各自品牌与 URL
  - 指出哪些区间拥挤、哪些区间空着
  - SKU 数量不足以判断分布时明确说出来，不要硬下结论

  ## 差异化判断（可证伪）
  - 每条必须有：具体数字/价位、指向的具体缺口、依赖的未验证前提
  - 自查：把品牌名换成任意同类品牌，这句话还成立吗？成立就是废话，重写
  - 找不到真实缺口就写「未发现明显缺口」并说明理由

  ## 抓取观察记录
  只记录**客观事实**，不要写"已核实"这类自我评价——核实由代码事后判定。
  | 我抓的 URL（必须与正文一致） | 想找什么 | 页面类型 | 内容里有没有该信息 | 没有的话我做了什么 |

  ## 完成条件自查
  | 条件 | 要求 | 实际 | 是否达标 |
  |------|------|------|----------|
  | 具体 URL 数 | ≥6 | | |
  | 实际抓取过的商品页数 | ≥3 | | |
  | 竞品家数 | ≥3 | | |
  | 带数字的可证伪判断 | ≥1 | | |

  ## 参考文献
  - 标题 | URL | 级别；须与正文使用的 URL 一致
