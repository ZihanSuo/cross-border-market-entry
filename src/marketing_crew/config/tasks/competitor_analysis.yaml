name: competitor_analysis_task
agent: competitor_analyst
prompt_file: prompts/competitor_analyst.md
description: |
  基于上游可行性与开拓结论，完成**可核对**竞品分析。
  不要重复可行性长文或开拓路径专章。

  用户简报：
  {brief}

  ## 第 0 步（写任何内容之前必须先做）：确定目标市场与本地货币

  从上面简报的 `market_scope` 读出**目标市场国家/地区**，并在报告开头用一行写明：
  「本报告目标市场：<从 brief 读到的市场> ；本地货币：<该市场的货币与符号>」。

  **本文档下面所有提到「目标市场」的地方，一律指你在这一步读出来的那个市场，不是英国、
  也不是任何其他默认国家**——历史版本在这里出过严重错误：模板里写死了「英国」，
  结果做泰国案例时输出了「泰国品牌的英国市场份额」这种自相矛盾的内容。
  凡是你要写「XX 市场份额」「XX 渠道线索」的地方，XX 必须等于 brief 里的 market_scope。

  要求：
  1) 优先上游深拆名单；至少 3 家；上游点名的品牌尽量覆盖，或说明为何剔除。
  2) **品类对齐**：代表 SKU 须与用户产品**同属一个可比品类**（护肤对护肤、彩妆对彩妆，
     且细分品类尽量一致，例如面部精华对面部精华、散粉对散粉）；
     禁止拿沐浴露/身体乳对比面部精华油，也禁止拿防晒/护肤品对比眼影盘（不对齐则换 SKU）。
  3) 每家：代表 SKU + **本地货币标价** + **商品页 URL**；标价必须用目标市场的本地货币
     （例如英国用 £、泰国用 ฿、日本用 ¥），并优先找目标市场**本地零售站点**的在售页（非仅官网首页）。

  3.5) **【价格带需要足够的点，但宁缺毋滥】**
     历史问题：每家只给 1 个 SKU，3-4 家就是 3-4 个孤立价格点——**这构不成价格带**，
     所以「差异化机会」永远只能写「强调品牌独特性」这类换个品牌照样成立的空话。
     要谈价位缺口，至少需要能看出分布。

     **做法**：每家竞品**尽量**给 2-3 个 SKU，覆盖该品牌的低/中/高价位（同一可比品类内）。

     **但这条有一个绝对优先于它的约束**：
     **凑数量的价值远低于真实性。找不到真实商品页时，宁可只写 1 个 SKU，
     也绝不能拼一个「看起来像那么回事」的 URL。**

     这不是假设性的担心——上一轮实测：模型为了给出合格的商品页，
     按 Shopify 常见格式**凭记忆拼出了 5 条 URL，独立 HTTP 验证发现至少 3 条是 404**
     （`weleda.co.uk/products/weleda-skin-food-75ml`、
     `nealsyardremedies.com/wild-rose-beauty-elixir-30ml` 等）。
     这类 URL 域名对、路径格式对、品类也对，**所有机械检测都会放行**，
     只有真的发 HTTP 请求才能发现是空的。

     所以：**每一个你写下的商品页 URL，必须来自你实际搜索/抓取到的结果，
     不能凭对该品牌网站结构的印象拼出来。**做不到就写：
     「仅找到 N 个可核实 SKU，不足以判断该品牌价格区间」。
  4) 差异化必须挂钩 brief ≥2 条品牌事实；禁止空泛「讲中国故事」。
  5) 无证据不得写「中国品牌不被信任」之类定论。
  5.5) **可证伪差异化（深度硬规则）**：「差异化机会」至少 1 条必须同时包含
     （a）具体价格带或渠道缺口数字/事实 + URL 或「证据不足」；（b）一句可被打脸的前提
     （例：「若本地集合店已有 X 价位菌菇精华，则…」）。禁止只写「强调东方草本/提高透明度」。
  5.6) **仪器化核实**：对至少 **2 个**代表 SKU 的商品页调用 `scrape_page` 核对名称与标价；
     抓取失败则写明失败原因，该行标价最多「待验证」，禁止假装已核实。
  5.7) 若上游有缺口补证：可引用其「可引用新证据」；对其仍不足的命题不得升级成竞品结论。

  5.8) **【允许标记与上游的分歧】**
     你是最后一步，掌握的竞品事实比上游可行性研究更具体——**如果你查到的东西与上游的
     判断对不上，如实记下来，不要吞掉。**

     典型场景：可行性给「竞争强度」打了 3 分（依据「有可切入细分」），
     而你实际查完发现主要价位带已被本土头部品牌全覆盖——**这是真矛盾，
     且直接影响差异化判断能不能成立。**

     **什么才算分歧**（三者都要有）：上游有明确判断/评分 + 你有带 URL 的具体事实与之不符
     + 这个不符会影响结论。**不算的**：措辞差异、主观觉得上游太乐观、
     上游已标「证据不足」的命题（那是空白不是分歧）。

     **你负责标记，不负责推翻**——不要改写上游结论，只在专门一节里列出来供人判断。
  6) **市场份额/社会舆论（尽量做，做不到不硬编）**：每家竞品尽量补充**目标市场本地**市场份额
     （或增长率/排名等可比数据）与公开社会舆论/口碑线索（媒体评价、可核实的社媒/论坛讨论），
     两者都必须有具体 URL；找不到目标市场本地数据时写「目标市场本地数据证据不足」，
     **禁止**用全球市场份额数字冒充本地数据，**禁止**用单条评论/帖子代表整体舆论。

  硬规则：
  1. 无 https 不写价格数字；禁止空引用与假评价。
  2. 禁止「推荐进入路径」专章。
  3. 对比表必须含 SKU / 标价 / 商品页 URL；找不到标价则该行「待验证」并写检索失败说明。
  4. **「商品页」的判定标准（收紧，历史版本在这里反复出错）**：URL 必须指向**单一 SKU 的详情页**，
     且必须满足以下全部条件，任一条不满足就该行标「商品页待确认」，不要硬当 A 级证据用：
     - **不能是品牌首页**（如 `aesop.co.uk/`）
     - **不能是系列/分类/品牌列表页**（如 `.../collections/xxx`、`.../skin-care/`、
       `.../all-brands/list/...`、`.../c/brands/xxx`）
     - **不能是媒体文章/榜单页**（如杂志的「2024 年泰国必买美妆盘点」这类 `cosmopolitan.com/...`、
       `elle.com/...` 文章——文章不是商品页，即使里面提到了这个产品和价格）
     - **不能是其他国家/地区站点的商品页**（历史错误：用美国站 `yami.com/us/...` 的页面去支撑
       泰铢标价）。域名或路径里出现的国家/地区代码必须与目标市场一致；
       跨境代购/转运平台（如 Ubuy 一类）不能当作该市场的本地零售证据
  5. **参考文献必须复用正文已经用过的最精确 URL**：如果 Battlecard 正文某品牌用的是具体商品页
     链接，「参考文献」列表里同一品牌**不得**换成更笼统的品牌首页或分类页链接——参考文献是对正文
     引用的复核，不是重新写一遍品牌介绍。
  6. 市场份额/舆论类数字同样适用规则 1（无 https 不写数字）；无目标市场本地数据来源时，
     宁可整行写「证据不足」，不要用全球数据或竞品自己的营销话术替代。
  7. **禁止使用 `TBD`、`待更新`、`待补充`、`链接待确认` 这类占位符代替证据**：
     没有证据就写「证据不足」四个字，这是唯一允许的表达方式。写 TBD 既没有提供信息，
     也逃过了「证据不足」应有的警示作用，等于把空白伪装成待办。
expected_output: |
  开头一行：本报告目标市场：<brief 的 market_scope> ；本地货币：<该市场货币>

  ## 承接上游要点（各 2～3 条，不展开）
  ## 竞品选择说明（含为何剔除名单中某家，若有）
  ## Battlecard（逐家）
  - 代表 SKU + 本地货币标价 + 商品页 URL（品类须与用户产品可比；商品页须为**目标市场本地站点**的单品详情页，不是首页/分类页/媒体文章/他国站点）
  - 定位与卖点
  - 目标市场渠道线索（优先本地零售在售 URL）
  - 目标市场本地市场份额/增长率/排名（有 URL 才写；没有则「目标市场本地数据证据不足」）
  - 公开舆论/口碑线索（媒体评价或可核实的社媒/论坛讨论，需 URL；没有则「证据不足」）
  - 可借鉴 / 风险
  ## 对比矩阵
  | 品牌 | 代表 SKU（品类可比） | 标价（本地货币） | 商品页 URL | 定位一句话 | 目标市场渠道线索 | 相对用户品牌差异（挂钩 brief） |

  ## 价格带分布
  把**所有查到的可比 SKU** 按价位从低到高排开（不限于每家一个），标出品牌与 URL：

  | 价位 | 品牌 | SKU | 商品页 URL | 来源（搜索结果 / scrape 已核实） |

  然后回答两件事：
  - 哪些价位区间拥挤、哪些空着
  - **当前 SKU 数量是否足以判断分布**——不足就直接写「仅 N 个可核实 SKU，
    不足以判断价格带分布」，**不要硬下结论**。诚实说数据不够，比编一个漂亮的缺口有价值

  ## 与上游的分歧（如有；没有就写「本轮未发现与上游判断冲突的事实」）
  只写同时满足三条的：上游有明确判断/评分 + 我有带 URL 的具体事实与之不符 + 会影响结论。
  标记即可，不要改写上游结论。

  | 上游结论/评分 | 我查到的事实（须带 URL） | 分歧性质 | 对本报告结论的影响 |
  |---|---|---|---|

  ## 差异化机会（≥2 条 brief 事实；其中 ≥1 条可证伪：价格带或渠道缺口 + 前提）
  自查：把品牌名换成任意同类品牌，这句话还成立吗？成立就是废话，重写。
  ## 商品页核实记录（至少 2 次 scrape）
  | 品牌 | URL | scrape 结果（标价/SKU 是否一致） | 失败原因（若有） |
  ## 参考文献（标题 | URL | 级别；须与正文使用的 URL 一致，不得替换成更笼统的链接）

  注意：以上模板里的「目标市场」字样，输出时应替换成 brief 里实际的市场名称；
  任何位置都不得出现与 brief 的 market_scope 不一致的国家名。
output_file: outputs/competitor_battlecard.md
context:
  - market_feasibility_task
  - evidence_gap_fill_task
  - market_expansion_task
include_global_knowledge: false
knowledge_mode: registry
# 自我修正循环：产出后跑机械引用校验，有**严重问题**就把具体违规清单喂回来重跑。
# 挂在竞品这一步，是因为历史上引用问题最集中在这里（商品页 URL、标价、市场份额）。
# 警告级不拦——那些需要人工判断，拦下来会让链路频繁卡死。
# 关掉：环境变量 DISABLE_GUARDRAILS=1，或 CLI 传 --no-guardrails
guardrail: citation
guardrail_max_retries: 2
