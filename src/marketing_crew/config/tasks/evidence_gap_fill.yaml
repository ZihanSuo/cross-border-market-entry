name: evidence_gap_fill_task
agent: evidence_gap_filler
description: |
  这是可行性之后的**第二轮桌面补证**，不是重写可行性报告。

  目标：把上游最关键的「证据不足」尽量变成可核对的公开事实。
  **怎么搜、搜几轮、先查哪边——你自己决定**；系统只验收证据质量，不规定检索剧本。

  {brief}

  ## 你的任务（结果导向）

  1. 从上游抽出 2～5 个最关键缺口（优先用上游「证据缺口清单」；也可按你的判断增删，说明理由）。
  2. 对每个缺口做真实搜索，直到你认为「够用」或「公开网暂时挖不动」。
  3. 写下你找到的**具体事实**，或诚实的挖不动说明。

  ## 硬性前置条件：必须真的检索（跑完由代码核验，不看你怎么写）

  **这一步的全部价值就是「去查上游没查到的东西」。不检索就没有存在意义。**

  - 你**至少要发起 3 次成功的搜索调用，覆盖至少 2 个不同的查询词**。
  - 这个数字由工具调用审计日志客观统计，**与你在报告里怎么描述检索过程无关**。
    没达到会被自动打回重做，并把真实调用次数告诉你。

  **两条最容易踩的红线：**

  1. **「本轮检索无果」只有在真的搜过之后才能写。**没搜就写它，属于伪造过程描述——
     这比承认没查到严重得多，因为它让下游误以为这个方向已经排除了。
  2. **上游报告里已经有的 URL，不算你新查到的事实。**把上游链接换个说法重写一遍
     不是补证，是复述；它会让「证据缺口」看起来关闭了，实际上一点没动。
     引用上游内容时必须注明「（上游已有）」。

  ## 质量门槛（只锁这些，不锁步骤）

  1. **禁止伪造/占位 URL**：不许 `product/12345678`、`链接待定`、`example.com`、编造域名。
     **真的搜过但确实没找到**，就写「证据不足 / 本轮检索无果」，不要假装有链接。
  2. **链接必须干活**：每条采用的 URL 旁边写一句可核对事实（页面上能看见的内容）。
     - 有可用事实 → 状态用「部分补证」或「已补充（仍须人工复核）」
     - **禁止**「参考文献里有链接 + 正文写本轮检索无果」这种自相矛盾
  3. **两角度规则（query 自定，不锁死用词）**：每个缺口必须覆盖
     (A) 态度/概念/趋势 与 (B) 当地零售平台或品牌名+渠道名。
     若 (A) 无可用事实，**必须再搜 (B)**，禁止同一 query 复读充数。
     跑完有代码门禁：若 tool_audit 显示补证查询全落在单一角度，会判失败。
  4. **不得升级证据**：公开网补不动时，保持「仍证据不足」；禁止写成已证实偏见或已证实机会。
  5. **分层**：品类接受 / 对「中国」态度 / 对「中国品牌」态度 / 渠道合作性质 —— 分开写，不串层。
  6. **范围**：不做合规科普、开拓方案、竞品战卡、假问卷；目标市场 = brief 的 market_scope。

  ## 深度提示（建议，非强制清单）

  对「接受度 / 渠道是否有售 / 合作性质」类缺口，下列来源通常比付费库市场 Outlook 更有信息量：
  - 目标市场美妆电商/集合店的**真实商品页或品牌店页**（能看到在售、标价更好）
  - 品牌名 + 当地零售商名的新闻稿、合作宣布、可靠社媒带链接的帖
  - 可打开的论文/报告里**直接涉及中国品牌或本品类**的句子（摘一句 + 页内定位）

  你可以用任何语言检索；发现更好线索就追，不必忠于上游建议关键词。

  ## 自检（写完过一遍）

  - 每个缺口：要么有「事实+URL」，要么有「多样查询后仍无果」——二者必居其一
  - 没有假链；没有「有链接却称无果」
  - 「对下游用法」写清：哪些新事实能用、哪些仍不能当结论
expected_output: |
  开头一行：本报告目标市场：<brief 的 market_scope>；补证轮次：可行性后第二轮（自主检索）

  ## 从上游提取的证据缺口
  | 缺口 ID | 命题 | 上游状态 | 为何关键（你的判断） |
  |---------|------|----------|----------------------|

  ## 补证结果（逐条）
  ### 缺口 <ID>
  - 检索策略（简述你怎么查的；列出实际查询词，展示角度差异）
  - 新事实（每条：可核对的一句话 | URL | 级别 A/B/C）
    - 若无任何可用事实：写「本轮检索无果」，并说明卡点（不是再贴无关市场报告充数）
  - 更新后状态：已补充（仍须人工复核） / 部分补证 / 仍证据不足（本轮检索无果）
  - 不得推出的结论：（防止下游误读）

  ## 仍未关闭的缺口（给人工）
  - 哪些继续桌面可能有解；哪些大概只剩问卷/渠道问询

  ## 对下游开拓 / 竞品的用法
  - 可引用的新事实（编号）
  - 仍禁止写成事实的命题

  ## 参考文献（标题 | URL | 级别；仅列入文真正用过的）
output_file: outputs/evidence_gap_fill.md
# search_effort 必须排在 citation 前面：一份零检索但格式漂亮的报告，
# 会先通过引用校验，让人误以为它已经合格了。先问「有没有真去查」，再问「引用得对不对」。
guardrail: search_effort,citation
guardrail_max_retries: 2
context:
  - market_feasibility_task
include_global_knowledge: false
knowledge_mode: registry
