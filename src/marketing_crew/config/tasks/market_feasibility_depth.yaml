name: market_feasibility_depth_task
agent: market_researcher_feasibility
output_file: outputs/market_feasibility.md
context: []
include_global_knowledge: false
knowledge_mode: registry
# 硬证据地板 → 评分算术 → 引用。共享软上限见 guardrails._compose（防整条 Crew 被重试耗尽打断）
guardrail: artifact_feasibility,scoring,citation
guardrail_max_retries: 3
description: |
  以下是用户提供的项目信息与原始材料。本步骤输出**决策备忘录式可行性研究**（Depth V1）。
  不要展开开拓路径与执行方案。

  {brief}

  ## Depth V1 写作原则（先读）

  1. **正文可以按证据自由拉长或缩短**——有货就写透，没货就短写并标「证据不足」。
     禁止为了「章节整齐」灌水。
  2. **系统用文末「硬证据清单」做地板验收**；不过会自动打回重跑。
  3. 可信度硬规则（空话禁令、打分锚点、零搜索不下乐观结论、禁止假 URL/TBD、
     证据不足不得后文升级、权重和=1.0、总分决定结论档位）**全部有效**。
  4. **加权总分必须算对**（代码会重算）；算式写错也是严重问题。

  ## 第 0 步

  开头一行：「本报告目标市场：<market_scope>；品类：<品类>」。
  全文不得出现与 brief.market_scope 不一致的国家名。
  「建议」一节必须出现可识别结论措辞：建议进入 / 先验证假设、暂缓铺货 / 暂不建议。

  ## 打分与结论（必须）

  权重建议：需求匹配 0.25、合规 0.15、渠道 0.20、竞争 0.20、品牌资产 0.20。
  锚点与档位同 research_only：≥3.5 建议进入；2.5–3.5 先验证暂缓铺货；<2.5 暂不建议。
  渠道可达若只有平台首页、没有具体在售页，不得打到 4–5；渠道证据不足时最多中性 3。

  ## 品类研究

  必须先搜索再写「已有市场空间 / 多款在售」。深度=可核对本地观察（真商品页/报道），不是更长形容词。

  ## 中度地板（artifact_check）——渠道只有两条合法出路

  文末必须有：

  ```
  ## 硬证据清单
  ### 渠道/零售可见度
  ```

  **出路 A**：≥2 条**可计入**的零售/电商 URL（商品页或品牌店页）。
  **白名单才算**（举例）：KONVY / Shopee / Lazada / Beautrium / Cult Beauty / Boots /
  Space NK / Lookfantastic / Watsons / 品牌官方商城（如 herbeast.world）；
  德国家电：MediaMarkt / Saturn / Otto / Idealo / Amazon.de **PDP 或店页**（`/b?node=` 分类页不计）。
  以下**一律不计**：Instagram/Facebook、市场规模报告、法规咨询站（gov.uk/HSE/REACH 说明页）、
  BeautyMatter 等媒体报道、品牌官网「关于我们」——YanLab 媒体通稿 ≠ 主流零售货架。

  **出路 B（诚实缺口）**：真搜过仍没有 → 在该子节写「证据不足」+ 已试 query；
  且你必须**先**对目标市场零售商发起真实搜索（TH：KONVY/Shopee/Lazada/Beautrium；
  UK：Cult Beauty/Boots 等；DE：MediaMarkt/Saturn/Otto/Amazon.de PDP——工具审计可见）。
  禁止用研报/法规页假装填满清单。

  若 brief 提到某零售商「已有触点」，你必须去搜该零售商域名下的页面；搜不到就降级为证据不足，
  不要改用品牌官网首页顶替。

  ## 评分表格式（必须，供 scoring_check）

  使用与 research_only 相同的表头：维度 | 权重 | 得分 | 对照哪条锚点 | 依据 | URL/…
  并写出加权总分算式（自己验算一遍）；结论档位必须与总分一致。

  ## 建议覆盖的分析面（顺序可调，勿灌水）

  建议一页纸 → 品牌匹配 → 品类/文化（分层）→ 门槛 → 证据摘要 → 评分表 →
  机会风险 → 证据缺口清单（2～5）→ 参考文献 → **硬证据清单**。
expected_output: |
  开头一行：本报告目标市场：…；品类：…

  ## 建议（一页纸）
  - 结论必须是三选一措辞：建议进入（可开始准备） / 先验证假设、暂缓铺货 / 暂不建议
    并括号标注加权总分

  另须含：品牌匹配、品类/文化分层、门槛、**可行性评分表（格式不可改）**、
  证据缺口清单、参考文献。各节长短随证据变化，禁止空心灌水。

  ## 可行性评分表
  | 维度 | 权重(合计1.0) | 得分(1-5) | 对照哪条锚点 | 依据 | URL/用户资料/证据不足则中性 |
  |------|---------------|-----------|--------------|------|------------------------------|
  | 需求匹配 | 0.25 | | | | |
  | 合规可完成性 | 0.15 | | | | |
  | 渠道可达 | 0.20 | | | | |
  | 竞争强度 | 0.20 | | | | |
  | 品牌资产匹配 | 0.20 | | | | |
  - 写出：**单独一行** `加权总分 = 0.25×a + 0.15×b + 0.20×c + 0.20×d + 0.20×e = X.XX`
    （不要把算式拆进表格单元格；depth_feas_v2 那样写会导致校验跳过）
  - **先自己把乘法加法算对**，再写结论；X.XX 必须与各行权重×得分一致

  ## 硬证据清单（机械验收用）
  ### 渠道/零售可见度
  - 出路 A：<零售/电商 URL> | <一句话观察>（≥2，非社媒/非研报/非法规/非官网首页）
  - 或出路 B：证据不足。已试检索：`…` / `…`（须真实调用搜索；工具审计可见零售平台名）
  ### 可证伪主张（推荐）
  - 主张：…
  - 打脸条件：若…则不成立
  - 验证方法：…
