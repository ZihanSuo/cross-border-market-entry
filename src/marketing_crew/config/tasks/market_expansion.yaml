name: market_expansion_task
agent: market_researcher_expansion
description: |
  基于上游**市场可行性**结论与用户材料，完成开拓路径研究。

  {brief}

  ## 硬规则（B1 / A1 / C）

  ### 与上游一致性（B1）
  0. **「服从上游」的确切含义（重要，这条以前写得太死）**：
     你的**路径建议与语气**必须服从上游结论——上游说暂缓，你就不能写进军计划。
     **但这不等于你必须假装没看见矛盾的事实。**

     以前这里写的是「严格服从上游结论，禁止与可行性打架」，本意是防止前后语气不一致，
     副作用是把**真实的分歧信号也一起抹掉了**：如果你查到的事实与上游的判断对不上，
     那是有价值的信息，不该被吞掉。

     **正确做法**：路径部分照常服从上游；同时在「与上游的分歧」一节**如实记录**你发现的
     矛盾事实。你负责**标记**，不负责**推翻**——最终结论由人来判断。

     **什么才算分歧**（三者都要有，缺一不写）：
     - 上游给出了一个**明确的判断或评分**（如「竞争强度 3 分：有可切入细分」）
     - 你查到了**带 URL 的具体事实**与之不符（如四个价位带均已被本土头部覆盖）
     - 这个不符**会影响路径选择**（不影响的就别写，避免为凑而凑）

     **不算分歧、不要写的**：措辞差异、你个人觉得上游太乐观/太保守但拿不出新证据、
     上游已标「证据不足」的命题（那不是分歧，那本来就是空白）。

  1. 开篇必须用一句话复述上游结论原文倾向（建议进入 / 先验证暂缓铺货 / 暂不建议）。
  2. 若上游为 **「暂不建议」或「先验证、暂缓铺货」**：
     - **禁止**使用「推荐主路径：平台入驻并快速进入市场」这类进军语气；
     - 标题与正文改为 **「条件满足后的路径选项（非当前执行计划）」**；
     - 每条路径必须写清：依赖上游哪条门槛/假设先成立。
  3. 若上游为「建议进入（可开始准备）」：才可写「当前优先路径」。

  ### 空话与证据（A1 / C）
  4. 禁止把「找法务 / 任命 RP」当作路径推荐理由或高置信依据。
  5. 路径「高」置信度须有**直接相关**证据，例如：
     - 目标零售商上**已有同类品牌/同品类产品**在售的类目或品牌页；或
     - 公开的入驻说明/招商页（非网站首页）。
     **任何电商平台或零售商的首页**（如 `shopee.co.th/`、`cultbeauty.co.uk/` 这类光秃秃的域名根路径）
     → 最高只能给「中」，**不得给「高」**；这条对所有市场的所有平台一视同仁，
     历史版本出现过拿 Shopee 首页当「高」置信度依据的错误。
  6. **禁止**用竞品官网证明「本地分销适合本品牌」。
  7. 必须引用 brief ≥2 条品牌事实解释路径适配。
  8. 数字与证据分级遵循 `source_rules`。
  9. **禁止使用 `TBD`、`待更新`、`待补充`、`链接待确认` 这类占位符代替证据**：
     没有证据就写「证据不足」，这是唯一允许的表达。TBD 既不提供信息，也逃过了
     「证据不足」应有的警示作用，等于把空白伪装成待办。
  10. 全文提到目标市场时，一律用 brief 里 `market_scope` 的实际市场名，
     **不得出现与之不一致的国家名**（历史版本出现过做泰国案例却满篇写「英国」的错误）。

  ### 承接缺口补证（新增）
  11. 若上游存在 `evidence_gap_fill` 补证结果：路径理由/信任机制中**优先引用其「可引用的新证据」**；
      对其标注「仍证据不足 / 本轮检索无果」的命题，**禁止**在开拓里升级成已证实前提。

  ## 分析框架
  1. 承接上游结论与门槛（不重做可行性）
  2. 吸收缺口补证中可引用的新证据（若有）
  3. 路径对比表（条件式）
  4. 获客与信任（战略层；无证据不写死名单）
  5. 定位与本地化优先级（挂钩 brief）
  6. 分阶段：若上游暂缓，阶段 1 必须是「验证假设」，不是「上架开卖」

  ## 检查清单
  - 与上游结论语气一致
  - 无「法务咨询」当主路径
  - 无首页/竞品站滥撑高置信度
  - 未把补证里仍不足的命题写成既定事实
expected_output: |
  ## 承接上游结论（必须与可行性一致）
  - 上游结论：……
  - 本文角色：当前执行计划 / 仅条件路径选项（二选一，按上游）

  ## 与上游的分歧（如有；没有就写「本轮未发现与上游判断冲突的事实」）
  只写**同时满足三个条件**的：上游有明确判断 + 你查到带 URL 的具体事实与之不符 + 这个不符会影响路径选择。
  你负责标记，不负责推翻——路径建议仍按上游结论走。

  | 上游结论/评分 | 我查到的事实（须带 URL） | 分歧性质 | 对路径选择的影响 |
  |---|---|---|---|

  宁可写「未发现冲突」，也不要为了填表而把措辞差异或主观感受当成分歧。
  - 缺口补证采纳了哪些新证据 / 哪些仍不可当事实（各 1～3 条）

  ## 路径对比表
  | 路径 | 适合本品牌的理由（引用 brief） | 须先满足的上游条件 | 风险 | 置信度 | 直接相关依据 URL（禁止仅首页） |
  |------|-------------------------------|--------------------|------|--------|--------------------------------|

  ## 路径取舍说明
  - 若上游暂缓/暂不建议：写「条件满足后优先考虑的路径」+「现在不应做的事」
  - 若上游建议准备进入：写「当前优先路径与备选」

  ## 核心获客与信任机制（战略层）
  ## 定位方向与本地化优先级（挂钩 brief）
  ## 分阶段节奏（暂缓时阶段1=验证假设，禁止直接铺货）
  ## 风险与应对（禁止空话合规套话）
  ## 建议进一步研究
  ## 参考文献（标题 | URL | 级别A/B/C）
output_file: outputs/market_expansion.md
context:
  - market_feasibility_task
  - evidence_gap_fill_task
include_global_knowledge: false
knowledge_mode: registry
