name: qa_review_task
agent: brand_qa_checker
description: |
  对以上所有上游输出做最终审校。这一步不是写读后感，是**逐条机械核对**是否违反
  `source_rules.md` 里的硬规则——历史版本里出现过 example.com 假链接、拿机构首页当
  市场规模证据、参考文献表格留着 `N/A | N/A` 没填这类问题，靠印象判断"有没有来源"
  是抓不出来的，必须真的把每一条拎出来检查。

  ## 必须做的机械核对（逐条列出结果，不要只写结论）

  1. **列出上游所有输出里出现的每一个 URL**（去重），对每一个标注：
     - 是否是 example.com / test.com / placeholder.com 等明显占位域名 → 若是，直接判「不通过」
     - 是否只是机构首页（无具体文章/报告路径）却被当作数据来源 → 标「首页证据，需要换成具体页面」
     - 是否与它旁边的结论真正相关（链接内容能不能支持那句话）→ 标「证据错配」或「相关」
  2. **扫描每张参考文献表 / 证据摘要表**，找出还留着模板占位符（如 `N/A | N/A`、空单元格连续出现）
     没有真正填写的行，逐行列出在哪个文件、哪一节。
  3. **核对门槛清单的状态值**：只能是「规则已核实 / 品牌侧未完成/未知 / 待验证（市场假设）/ 红线」
     四种之一；出现其它写法（如「已确认」「品牌已就绪」）直接判违规。
  4. **核对是否把行业标配合规（任命本地责任人/代理、成分与化学品注册、备案通知等，
     具体制度名按目标市场而定）当成了「本品牌特有洞察」或
     「暂不建议进入」的主因**——source_rules.md 和 market_feasibility 的硬规则都明确禁止这样写。
  5. **核对品牌表达一致性**：品牌名、定位描述、创始人背景等跨文件是否互相矛盾。
  6. **核对是否有夸大/绝对化用词**（"最"、"第一"、"一定"、"100%"等）或无证据的偏见性结论
     （例如无 URL 却写"中国品牌在当地不被信任"）。
  7. **【最容易漏、必须专门做一遍】核对「本该有 URL 却空着」的位置**：
     上面第 1 条查的是"已经写出来的 URL 对不对"，**天生查不到"该有链接的地方根本没写链接"**。
     历史教训：backup_v7 里三家竞品的「公开舆论/口碑线索」全是"消费者反馈普遍积极"
     这类无来源断言，既没有 URL 也没写"证据不足"，逐 URL 核查表完全没发现，
     因为那几行压根没有 URL 可查。
     所以必须**反过来做一遍**：先列出规则要求必须有证据的字段，再逐个确认它到底是
     "给了 URL" 还是 "老实写了证据不足"，两者都不是就是违规。至少覆盖以下字段：
     - 竞品每家的**市场份额/增长率/排名**（competitor_analysis 要求 6）
     - 竞品每家的**公开舆论/口碑线索**（同上）
     - 竞品每家的**商品页 URL**（硬规则 3/4，且必须是目标市场本地站点的单品详情页）
     - 门槛清单每行的**依据列**（market_feasibility 规则 27，标"规则已核实"的行必须有 URL）
     - 可行性评分表每行的**最后一列**（有 URL 写 URL、来自 brief 写"用户资料"、
       没有写"证据不足"，不得留空或写 TBD）
     - 证据摘要各表的 **URL 列**
  7.5. **【判定「已写证据不足」之前，先看这行有没有数字】**：
     "证据不足""待验证"这类措辞**只对不含具体数字的定性描述有效**。
     如果一行写的是「市场份额约 25%（证据不足）」，那它**不是**合规的"已写证据不足"，
     而是**违规**——给了没有来源的数字，再用免责词包装。
     历史教训：花知晓 v2 里三家竞品的市场份额分别写「约 25%（证据不足）」
     「约 18%（证据不足）」「约 15%（证据不足）」，上一版 QA 只看到"证据不足"
     四个字就全判成合规，而机械校验正确判定为三处违规。
     **判定规则**：该行含百分比/倍数/排名等具体数字 → 必须有 URL，否则一律违规，
     有没有"证据不足"字样都不豁免。
  7.6. **舆论/口碑证据必须是具体内容页，不能是账号主页**：
     引用 facebook.com/品牌名、instagram.com/品牌名、twitter.com/品牌名 这类
     **品牌自营账号主页**当作"公开舆论"是无效的——品牌自己的主页证明不了公众口碑。
     必须是具体的帖子、评论串、或第三方测评文章。
  8. **核对与 brief 原文是否一致——这里要查的不只是数字，更要查「推断」**：
     把报告里所有声称来自用户资料/brief 的内容，回到上面的用户简报逐条比对。
     **需要查的有三类，缺一不可**：

     **(a) 事实类**：数字、年份、渠道、团队背景、价格等。
     历史教训：某版报告写"该品牌侧重于 **65%** 25–40岁女性目标受众"，但 brief 里
     根本没有 65% 这个数字，是模型自己编的，且因为不含 URL 而躲过了所有机械校验。

     **(b) 推断类（最容易漏，上一版就漏在这里）**：报告有没有把 brief 里的说法
     **往前多推了一步**，写成了 brief 并没有说的结论。这类表述**不含数字**，
     所以只查数字一定会漏。
     历史教训：花知晓某版报告写"CMO 已明确指出国际化扩张为主要焦点，
     **表明已按计划扩展至泰国市场**"——brief 原文只说国际化是 major focus、
     泰国在**布局名单**里，从没说"已经扩展进去了"。「在名单里」和「已扩展」
     是两件事，这句话有 URL、格式完美、语气自然，唯一的问题是多跨了一步。
     **判定方法**：凡是出现"表明""说明""因此""可见""意味着"这类推断连接词，
     或把"计划/意向/目标"写成"已完成/已实现"的地方，都回 brief 核对一遍原文
     到底说到哪一步。**推断超出原文即为违规**，即使推断得很合理。

     **(c) 分歧类**：brief 里**明确标注"资料有分歧"的事实**（如成立年份 2020 vs 2021），
     报告引用时必须写明选了哪个来源，只写一个数字不给出处即为违规。

     **本栏禁止只写"未发现数字类问题"就交差**——必须明确说明 (a)(b)(c) 三类都查过了。

  用户简报：
  {brief}
expected_output: |
  ## 逐 URL 核查表
  | 文件 | URL | 类型（占位域名/首页证据/证据错配/他国站点/正常） | 结论 |

  ## 应有证据却缺失的位置（**反向核查，不要跳过**）
  说明：上一张表查的是"写出来的 URL 对不对"，这张表查的是"该有 URL 的地方是不是空着"。
  逐个字段确认，不要只写"未发现问题"。
  | 文件 | 字段（如 Aesop 的公开舆论/口碑线索） | 实际写法 | 判定（有 URL / 已写证据不足 / **违规：既无 URL 也无证据不足**） |

  ## 与 brief 不符或无出处的事实清单
  必须分三类各核一遍并写明结论，不得只写"未发现数字类问题"：
  | 类别（事实/推断/分歧） | 文件 | 报告里的说法 | brief 里的实际内容 | 判定（一致 / **brief 中不存在** / **推断超出原文** / **有分歧但未注明出处**） |

  ## 未填模板占位符清单
  - 文件 | 章节 | 原文片段

  ## 门槛表状态值违规清单（若有）
  - 文件 | 违规写法 | 应改为

  ## 必须修正（阻塞上线）
  - 逐条：问题 | 出现在哪个文件哪一节 | 为什么违反规则 | 应该怎么改

  ## 建议优化（不阻塞，但值得改）

  ## 上线前检查清单
  - [ ] 无 example.com / 占位域名
  - [ ] 无机构首页/品牌首页当数据证据
  - [ ] 商品页均为目标市场本地站点的单品详情页（非他国站点、非分类页）
  - [ ] 参考文献表无未填占位符
  - [ ] 门槛表状态值合法且「依据」列均有 URL 或明确「证据不足」
  - [ ] **市场份额、舆论口碑等字段无「既无 URL 也无证据不足」的情况**
  - [ ] **报告中声称来自 brief 的事实均能在 brief 里找到；有分歧的事实已注明出处**
  - [ ] 无行业标配合规被当成品牌特有否决理由
  - [ ] 品牌表达跨文件一致

  ## 交叉一致性自查（**输出前最后一步，必须做**）
  写完上面所有表格后，回头核对三件事，发现不一致就改，不要留着：

  1. **同一个 URL 在不同表格里的判定必须一致**。历史教训：花知晓 v2 里
     `facebook.com/mistine` 在「逐 URL 核查表」被判"首页证据／不通过"，
     却在「应有证据却缺失」表里被判"有 URL／合规"——同一个链接、两张表、相反结论。
  2. **检查清单的勾选必须与阻塞问题一致**。前面列了任何阻塞问题，对应检查项就不能打勾。
     历史教训：某版"列了阻塞问题却把六项全打勾"。
  3. **「已写证据不足」的判定必须先过数字关**（见上面规则 7.5）。含数字的行即使写了
     "证据不足"也是违规，不能判成合规。
output_file: outputs/final_review.md
context:
  - market_feasibility_task
  - evidence_gap_fill_task
  - market_expansion_task
  - competitor_analysis_task
  - channel_strategy_task
  - xhs_content_task
  - douyin_plan_task
include_global_knowledge: true
knowledge_files:
  - core/source_rules.md
  - core/competitor_schema.md
